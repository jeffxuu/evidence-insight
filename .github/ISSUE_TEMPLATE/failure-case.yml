name: Evidence or rendering failure
description: Submit a reproducible boundary failure with an inert, redistributable input.
title: '[Failure] '
body:
  - type: textarea
    id: input
    attributes:
      label: Input and exact user request
      description: Include source provenance and reuse permission. Redact personal data and credentials.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Model, host, version, reasoning effort, date and tools
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Current output and observed failure
      description: Include the exact relevant span; do not submit hidden reasoning or private host instructions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected boundary and proposed regression
      description: Explain which proposition, qualifier, source role or artifact rule was violated.
    validations:
      required: true
